<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RingPro — Configurações Academia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="../_shared/layout.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">RINGPRO</div>
      <nav class="sidebar-nav">
        <a href="00-Dashboard.html">Dashboard</a>
        <a href="01-Alunos.html">Alunos</a>
        <a href="02-Professores.html">Professores</a>
        <a href="03-Categorias.html">Categorias</a>
        <a href="04-Planos.html">Planos</a>
        <a href="05-Financeiro.html">Financeiro</a>
        <a href="06-Presenca.html">Presença</a>
        <a href="07-Configuracoes.html" class="active">Configurações</a>
        <a href="08-Notificacoes.html">Notificações</a>
      </nav>
    </aside>

    <div class="dashboard-main">
      <header class="topbar"><div><strong>Academia Teste</strong></div></header>

      <main class="content">
        <h1 class="page-title">Configurações</h1>
        <p class="page-sub">Dados da academia, trial e módulos</p>

        <div class="panel-grid">
          <section class="card">
            <div class="section-title">Dados gerais</div>
            <div class="form-group" style="margin-top:16px;">
              <label class="label" for="academy-name">Nome</label>
              <input class="input" id="academy-name" type="text" value="Academia Teste">
            </div>
            <div class="form-group">
              <label class="label" for="slug">Slug landing</label>
              <input class="input" id="slug" type="text" value="academia-teste">
            </div>
          </section>

          <section class="card">
            <div class="section-title">Módulos (feature flags)</div>
            <div style="margin-top:16px;font-size:14px;display:grid;gap:10px;">
              <label style="display:flex;gap:8px;"><input type="checkbox" checked> Pagamento cartão</label>
              <label style="display:flex;gap:8px;"><input type="checkbox" checked> PIX / Boleto</label>
              <label style="display:flex;gap:8px;"><input type="checkbox"> Push notifications</label>
              <label style="display:flex;gap:8px;"><input type="checkbox" checked> Landing pública</label>
            </div>
          </section>

          <section class="card" style="grid-column:1/-1;">
            <div class="section-title">Landing page</div>
            <p class="section-sub" style="margin:8px 0 16px;">Editor visual — módulo `module_landing`</p>
            <a href="../landing/01-Editor.html" class="btn btn-primary">Abrir editor</a>
          </section>
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="button">Salvar</button>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
