<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RingPro — Verificação 2FA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_shared/base.css">
  <style>
    .form-group { margin-bottom: 16px; }
    .btn-submit { width: 100%; margin-top: 8px; padding: 12px; }
    .hint { font-size: 13px; color: var(--color-text-muted); margin-bottom: 20px; line-height: 1.5; }
    .code-input {
      letter-spacing: 0.4em;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="auth-layout">
    <div class="auth-card card">
      <div class="auth-logo">
        <h1>RINGPRO</h1>
        <p>Verificação em duas etapas</p>
      </div>

      <p class="hint">Digite o código de 6 dígitos do seu aplicativo autenticador.</p>

      <form>
        <div class="form-group">
          <label class="label" for="code">Código</label>
          <input class="input code-input" type="text" id="code" maxlength="6" inputmode="numeric" placeholder="000000" required>
        </div>
        <button type="submit" class="btn btn-primary btn-submit">Verificar</button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--color-text-muted);">
        <a href="00-Login.html" style="color:var(--color-primary);">Cancelar</a>
      </p>
    </div>
  </div>
</body>
</html>
